<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动一动</title>
    <meta name="description" content="我的跟练视频收藏页" />
    <meta property="og:title" content="动一动" />
    <meta property="og:description" content="我的跟练视频收藏页" />
    <meta property="og:type" content="website" />
    <!-- deployment-social-meta -->
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="动一动" />
    <meta name="twitter:description" content="我的跟练视频收藏页" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <link rel="stylesheet" href="./style.css?v=33" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-area">
          <div class="brand-mark">我的跟练视频</div>
        </div>
        <div class="top-actions">
          <label class="search-box">
            <input id="searchInput" type="search" placeholder="搜索标题或分类" />
          </label>
          <button class="primary-button add-video-button" type="button" id="openAddButton">
            添加
          </button>
        </div>
      </header>

      <section class="library-panel">
        <div class="category-filter" id="categoryFilter" aria-label="按分类筛选"></div>

        <div class="video-grid" id="videoGrid"></div>
        <p class="empty-state" id="emptyState">还没有视频</p>
      </section>

      <footer class="page-footer">
        <span class="footer-actions">
          <span id="videoCount">0 个视频</span>
          <span aria-hidden="true">｜</span>
          <button class="footer-export-button" type="button" id="exportButton">导出</button>
          <span aria-hidden="true">｜</span>
          <button class="footer-export-button" type="button" id="importButton">导入</button>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
          <span aria-hidden="true">｜</span>
          <button class="footer-export-button" type="button" id="copyLibraryLinkButton">复制链接</button>
          <span aria-hidden="true">｜</span>
          <button class="footer-export-button" type="button" id="syncButton">同步设置</button>
        </span>
        <span class="footer-note">右上角添加视频，保存后会出现在上方。</span>
      </footer>
    </main>

    <div class="modal-backdrop" id="addModal" hidden>
      <section class="modal-panel add-modal" role="dialog" aria-modal="true" aria-labelledby="addVideoTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Add Video</p>
            <h2 id="addVideoTitle">添加到训练库</h2>
          </div>
          <button class="ghost-button" type="button" id="closeAddButton" title="关闭" aria-label="关闭添加窗口">×</button>
        </div>

        <form id="videoForm" class="video-form">
          <label class="input-group">
            <span>视频链接</span>
            <textarea id="urlsInput" placeholder="每行一个链接，可以一次贴很多个" autocomplete="off" required></textarea>
          </label>

          <div class="input-group">
            <span>标签</span>
            <div class="tag-picker" id="tagPicker" aria-label="选择标签"></div>
            <div class="tag-add-row">
              <input id="tagInput" type="text" placeholder="添加新标签" />
              <button class="secondary-button tag-add-button" type="button" id="addTagButton">添加</button>
            </div>
            <p class="field-hint">最多选择 3 个标签</p>
          </div>

          <div class="modal-actions">
            <p class="status-line" id="statusLine" role="status"></p>
            <button class="primary-button" type="submit">
              <span aria-hidden="true">＋</span>
              保存
            </button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop player-backdrop" id="playerModal" tabindex="-1" hidden>
      <section class="modal-panel player-modal" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow" id="playerSource">准备播放</p>
            <h2 id="playerTitle"><a id="playerTitleLink" href="#" target="_blank" rel="noopener">选择一个视频</a></h2>
          </div>
          <button class="ghost-button" type="button" id="closePlayerButton" title="关闭" aria-label="关闭播放器">×</button>
        </div>
        <div class="player-frame" id="playerFrame"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="editModal" hidden>
      <section class="modal-panel edit-modal" role="dialog" aria-modal="true" aria-labelledby="editVideoTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Edit Video</p>
            <h2 id="editVideoTitle">修改视频信息</h2>
          </div>
          <button class="ghost-button" type="button" id="closeEditButton" title="关闭" aria-label="关闭编辑窗口">×</button>
        </div>

        <form id="editForm" class="video-form">
          <label class="input-group">
            <span>标题</span>
            <input id="editTitleInput" type="text" required />
          </label>

          <label class="input-group">
            <span>视频链接</span>
            <input id="editUrlInput" type="url" required />
          </label>

          <div class="input-group">
            <span>标签</span>
            <div class="tag-picker" id="editTagPicker" aria-label="选择标签"></div>
            <div class="tag-add-row">
              <input id="editTagInput" type="text" placeholder="添加新标签" />
              <button class="secondary-button tag-add-button" type="button" id="editAddTagButton">添加</button>
            </div>
            <p class="field-hint">最多选择 3 个标签</p>
          </div>

          <div class="modal-actions">
            <p class="status-line" id="editStatusLine" role="status"></p>
            <button class="primary-button" type="submit">保存修改</button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="tagRenameModal" hidden>
      <section class="modal-panel rename-modal" role="dialog" aria-modal="true" aria-labelledby="tagRenameTitle">
        <h2 id="tagRenameTitle">修改标签名称</h2>
        <form id="tagRenameForm" class="video-form">
          <label class="input-group">
            <input id="tagRenameInput" type="text" required />
          </label>

          <div class="modal-actions">
            <p class="status-line" id="tagRenameStatusLine" role="status"></p>
            <button class="secondary-button" type="button" id="cancelTagRenameButton">取消</button>
            <button class="primary-button" type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="syncModal" hidden>
      <section class="modal-panel rename-modal" role="dialog" aria-modal="true" aria-labelledby="syncTitle">
        <h2 id="syncTitle">同步设置</h2>
        <form id="syncForm" class="video-form">
          <p class="status-line" id="syncHelp">如果你已自行部署本站并接入 Supabase，可以输入部署时设置的 APP_WRITE_TOKEN，实现跨设备同步。它通常设置在 Vercel 的环境变量中，不是 Supabase 的 API Key。</p>
          <label class="input-group">
            <span>同步密钥（APP_WRITE_TOKEN）</span>
            <input id="syncTokenInput" type="password" autocomplete="off" aria-describedby="syncHelp syncStatus" required />
          </label>
          <p class="status-line" id="syncStatus" role="status"></p>
          <div class="modal-actions">
            <button class="secondary-button" type="button" id="disconnectSyncButton" hidden>断开同步</button>
            <button class="secondary-button" type="button" id="cancelSyncButton">取消</button>
            <button class="primary-button" type="submit" id="connectSyncButton">连接</button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="localImportModal" hidden>
      <section class="modal-panel rename-modal" role="dialog" aria-modal="true" aria-labelledby="localImportTitle">
        <h2 id="localImportTitle">导入本地收藏</h2>
        <div class="video-form">
          <p class="status-line" id="localImportStatus" role="status"></p>
          <p class="status-line">跳过重复链接，不覆盖云端已有视频，也不会删除本地收藏。</p>
          <div class="modal-actions">
            <button class="secondary-button" type="button" id="skipLocalImportButton">暂不导入</button>
            <button class="primary-button" type="button" id="confirmLocalImportButton">导入云端</button>
          </div>
        </div>
      </section>
    </div>

    <template id="videoCardTemplate">
      <article class="video-card">
        <button class="thumbnail-button" type="button">
          <img alt="" loading="lazy" />
          <span class="play-mark" aria-hidden="true">▶</span>
        </button>
        <div class="card-body">
          <div>
            <p class="source-label"></p>
            <h3><a class="card-title-link" href="#" target="_blank" rel="noopener"></a></h3>
          </div>
          <div class="card-actions">
            <span class="category-pill"></span>
            <button class="icon-button edit-button" type="button" title="编辑视频" aria-label="编辑视频">✎</button>
            <button class="icon-button delete-button" type="button" title="删除视频" aria-label="删除视频">×</button>
          </div>
        </div>
      </article>
    </template>

    <script src="./script.js?v=41"></script>
  </body>
</html>
